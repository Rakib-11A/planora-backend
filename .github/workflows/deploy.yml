name: Deploy Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: planora-backend
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript app
        run: npm run build

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Log in to Docker Hub (optional)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (optional)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/planora-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/planora-backend:latest

  deploy:
    name: Deploy and Validate
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.DEPLOY_HEALTHCHECK_URL != '' }}
    steps:
      - name: Deployment placeholder
        run: |
          echo "Connect this job to Railway/Render webhook or VPS ssh pull flow."
          echo "Current pipeline keeps deployment provider-agnostic."

      - name: Validate health endpoint after deployment
        run: |
          curl --fail --retry 10 --retry-delay 6 "${{ secrets.DEPLOY_HEALTHCHECK_URL }}"
