# Nginx reverse proxy for Planora API (Docker app on 127.0.0.1:5000).
# Install: copy to /etc/nginx/sites-available/planora, symlink sites-enabled, nginx -t && systemctl reload nginx
#
# For Let's Encrypt after DNS points to this server:
#   certbot --nginx -d api.yourdomain.com --redirect
# Or use deploy/enable-ssl.sh

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
